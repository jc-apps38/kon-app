<style>
/* Layout : appli mobile une colonne (max 480px) posée sur un fond « coucher de soleil » animé ; cartes vitrées ; barre d'onglets avec bouton rond central « Mes dates » */
:root{
  --bg:#FFF4EE; --glass:rgba(255,255,255,.86); --glow:rgba(240,56,107,.45); --glass-line:rgba(255,255,255,.9); --surface2:#FFF1EA;
  --ink:#2A1433; --muted:#7A5E80; --line:#F1DCD6;
  --coral:#FF5E5B; --violet:#7B4DFF; --sun:#FFB23F; --mint:#20C1A0;
  --grad:linear-gradient(135deg,#FF5E5B 0%,#FF3D8B 48%,#7B4DFF 100%);
  --on-accent:#FFFFFF; --accent:#F0386B; --accent-soft:#FFE1E8;
  --keep:#00C853; --keep-soft:#CFF8DE; --on-keep:#04240F; --next:#FF1F1F; --next-soft:#FFD2D2; --maybe:#E59A0B; --maybe-soft:#FFF1D2;
  --blob1:#FF9A7A; --blob2:#FF6FA8; --blob3:#A98BFF; --blob4:#FFD27A;
  --shadow:0 16px 36px -16px rgba(120,30,70,.35); --scrim:rgba(42,20,51,.45);
  --display:"Bricolage Grotesque","Avenir Next","Segoe UI",system-ui,sans-serif;
  --body:"Figtree","Helvetica Neue","Segoe UI",system-ui,sans-serif;
}
@media (prefers-color-scheme: dark){ :root:not([data-theme="light"]){
  --bg:#1A0D22; --glass:rgba(40,22,52,.88); --glow:rgba(255,92,138,.6); --glass-line:rgba(255,255,255,.08); --surface2:#2C1838;
  --ink:#FBEFF6; --muted:#C3A6C9; --line:#43284F;
  --accent:#FF5C8A; --accent-soft:#4A1C33; --on-accent:#FFFFFF;
  --keep:#1EF07A; --keep-soft:#0F3D22; --on-keep:#04240F; --next:#FF3A2E; --next-soft:#5C1410; --maybe:#FFC44D; --maybe-soft:#423112;
  --blob1:#B43A3A; --blob2:#A12C6E; --blob3:#4B2FA8; --blob4:#8A5A12;
  --shadow:0 16px 36px -16px rgba(0,0,0,.7); --scrim:rgba(0,0,0,.6); color-scheme:dark }}
:root[data-theme="dark"]{
  --bg:#1A0D22; --glass:rgba(40,22,52,.88); --glow:rgba(255,92,138,.6); --glass-line:rgba(255,255,255,.08); --surface2:#2C1838;
  --ink:#FBEFF6; --muted:#C3A6C9; --line:#43284F;
  --accent:#FF5C8A; --accent-soft:#4A1C33; --on-accent:#FFFFFF;
  --keep:#1EF07A; --keep-soft:#0F3D22; --on-keep:#04240F; --next:#FF3A2E; --next-soft:#5C1410; --maybe:#FFC44D; --maybe-soft:#423112;
  --blob1:#B43A3A; --blob2:#A12C6E; --blob3:#4B2FA8; --blob4:#8A5A12;
  --shadow:0 16px 36px -16px rgba(0,0,0,.7); --scrim:rgba(0,0,0,.6); color-scheme:dark }

*{box-sizing:border-box}
html,body{height:100%}
body{background:var(--bg); color:var(--ink); font-family:var(--body); font-size:15px; line-height:1.45;
  padding-left:max(16px, env(safe-area-inset-left, 0px)); padding-right:max(16px, env(safe-area-inset-right, 0px));
  -webkit-tap-highlight-color:transparent; overflow-x:hidden}
button,input,textarea{font:inherit; color:inherit}
button{cursor:pointer; border:0; background:none}
button:focus-visible,input:focus-visible,textarea:focus-visible,label.photo:focus-within{outline:3px solid var(--accent); outline-offset:2px}

/* fond animé */
.sky{position:fixed; inset:0; z-index:-1; overflow:hidden; background:var(--bg)}
.sky i{position:absolute; border-radius:50%; opacity:.75; will-change:transform; animation:drift 22s ease-in-out infinite alternate}
.sky i:nth-child(1){width:60vmax; height:60vmax; background:radial-gradient(closest-side, var(--blob1), transparent); top:-22vmax; left:-18vmax}
.sky i:nth-child(2){width:50vmax; height:50vmax; background:radial-gradient(closest-side, var(--blob2), transparent); top:10%; right:-25vmax; animation-delay:-6s}
.sky i:nth-child(3){width:55vmax; height:55vmax; background:radial-gradient(closest-side, var(--blob3), transparent); bottom:-25vmax; left:-10vmax; animation-delay:-12s}
.sky i:nth-child(4){width:34vmax; height:34vmax; background:radial-gradient(closest-side, var(--blob4), transparent); bottom:12%; right:-8vmax; animation-delay:-3s; opacity:.4}
.sky::after{content:""; position:absolute; inset:0; background-image:radial-gradient(var(--glass-line) 1px, transparent 1.4px); background-size:22px 22px; opacity:.35}

.app{max-width:480px; margin:0 auto; padding-block:14px calc(118px + env(safe-area-inset-bottom, 0px)); min-height:100%}
.app.shake{animation:shake .5s}
h1,h2,h3{font-family:var(--display); margin:0; text-wrap:balance; letter-spacing:-.015em}
.glass{background:var(--glass); border:1px solid var(--glass-line)}
.tabs.glass,.lockbar{-webkit-backdrop-filter:blur(14px); backdrop-filter:blur(14px)}

.top{display:flex; align-items:center; justify-content:space-between; gap:12px; padding-block:6px 16px}
.brand{font-family:var(--display); font-weight:800; font-size:26px; line-height:1; padding:9px 15px 10px; border-radius:18px; background:var(--glass); border:3px solid var(--accent); box-shadow:0 0 0 4px var(--accent-soft), 0 0 12px 1px var(--accent), 0 0 34px 4px var(--glow), inset 0 0 18px -4px var(--glow); text-shadow:0 0 16px var(--glow); animation:neon 2.4s ease-out 1 both}
@keyframes neon{0%{opacity:.3}8%{opacity:1}12%{opacity:.4}18%{opacity:1}24%{opacity:.7}30%,100%{opacity:1}}
.brand em{font-style:normal; background:var(--grad); -webkit-background-clip:text; background-clip:text; color:transparent}
.lock{font-size:11px; font-weight:700; color:var(--muted); padding:6px 10px; border-radius:999px; white-space:nowrap}
.eyebrow{font-size:11px; font-weight:700; text-transform:uppercase; letter-spacing:.12em; color:var(--muted)}
.view{animation:fadeup .35s ease both}
.h-big{font-size:32px; line-height:1.04}
.sub{color:var(--muted); margin:6px 0 0}

/* avatar rond + liseré */
.av{--ring:var(--line); position:relative; flex:none; width:var(--s,48px); height:var(--s,48px); border-radius:50%; padding:3px;
  background:conic-gradient(var(--ring) 0 100%); box-shadow:0 4px 12px -4px rgba(0,0,0,.25)}
.av.keep{--ring:var(--keep)} .av.keep .badge{color:var(--on-keep)} .av.maybe{--ring:var(--maybe)} .av.next{--ring:var(--next)} .av.new{--ring:var(--accent)}
.av .ph{width:100%; height:100%; border-radius:50%; overflow:hidden; border:2px solid var(--bg); display:grid; place-items:center; background:var(--surface2)}
.av .ph img,.av .ph svg{width:100%; height:100%; object-fit:cover; display:block}
.av .ini{font-family:var(--display); font-weight:800; font-size:calc(var(--s,48px)*.4); color:var(--accent)}
.av .badge{position:absolute; right:-2px; bottom:-2px; width:calc(var(--s,48px)*.38); height:calc(var(--s,48px)*.38); border-radius:50%;
  background:var(--ring); color:var(--on-accent); display:grid; place-items:center; font-size:calc(var(--s,48px)*.2); border:2px solid var(--bg)}

/* accueil */
.hello{display:grid; gap:4px}
.trio{display:grid; grid-template-columns:repeat(3,1fr); gap:10px; margin-top:18px}
.tri{border-radius:22px; padding:14px 8px; text-align:center; display:grid; justify-items:center; gap:6px}
.tri .dot{width:54px; height:54px; border-radius:50%; display:grid; place-items:center; font-family:var(--display); font-weight:800; font-size:24px; border:4px solid; font-variant-numeric:tabular-nums}
.tri.keep .dot{border-color:var(--keep); color:var(--keep); background:var(--keep-soft)}
.tri.maybe .dot{border-color:var(--maybe); color:var(--maybe); background:var(--maybe-soft)}
.tri.next .dot{border-color:var(--next); color:var(--next); background:var(--next-soft)}
.tri span{font-size:12.5px; font-weight:700}
.cta{margin-top:14px; border-radius:26px; padding:20px; background:var(--grad); color:var(--on-accent); display:grid; gap:12px; box-shadow:var(--shadow); position:relative; overflow:hidden}
.cta::after{content:"💘"; position:absolute; right:-6px; top:-10px; font-size:92px; opacity:.22; transform:rotate(14deg)}
.cta h3{font-size:23px; line-height:1.1; max-width:15ch}
.cta p{margin:0; opacity:.92; font-size:14px; max-width:28ch}
.cta .btn{background:#FFFFFF; color:#2A1433; width:auto; justify-self:start; padding:12px 18px}
.box{border-radius:22px; padding:16px; margin-top:12px}
.box h3{font-size:16px; margin-bottom:10px}
.last{display:flex; align-items:center; gap:12px; width:100%; text-align:left}
.tip{display:flex; gap:12px; align-items:flex-start}
.tip .em{font-size:28px; line-height:1}
.tip p{margin:4px 0 0; font-size:14px}

/* mes dates */
.seg{display:grid; grid-template-columns:repeat(3,1fr); gap:6px; border-radius:20px; padding:5px}
.seg button{border-radius:15px; padding:10px 4px; font-weight:700; font-size:13px; color:var(--muted); display:flex; flex-direction:column; align-items:center; gap:2px; transition:background .2s,color .2s}
.seg button b{font-family:var(--display); font-size:20px; line-height:1}
.seg button[aria-pressed="true"][data-s="keep"]{background:var(--keep); color:var(--on-keep)}
.seg button[aria-pressed="true"][data-s="maybe"]{background:var(--maybe); color:var(--on-accent)}
.seg button[aria-pressed="true"][data-s="next"]{background:var(--next); color:var(--on-accent)}

@keyframes drift{0%{transform:translate(0,0) scale(1)}100%{transform:translate(6vmax,5vmax) scale(1.12)}}

@keyframes fade{from{opacity:0}}

 e.style.setProperty("--dx",(Math.random()*opts.dx*2-opts.dx)+"px");e.style.setProperty("--rot",(Math.random()*opts.rot*2-opts.rot)+"deg");
 e.style.setProperty("--d",(opts.d0+Math.random()*opts.dw)+"s");e.style.animationDelay=(Math.random()*.35)+"s";fx.appendChild(e);setTimeout(()=>e.remove(),(opts.d0+opts.dw+.5)*1000)}}

function swipe(c){let x0=0,dx=0,on=false;const sy=c.querySelector(".stamp.yes"),sn=c.querySelector(".stamp.no");
 c.addEventListener("pointerdown",e=>{on=true;x0=e.clientX;dx=0;c.classList.remove("anim","in");try{c.setPointerCapture(e.pointerId)}catch(_){}});
 c.addEventListener("pointermove",e=>{if(!on)return;dx=e.clientX-x0;c.style.transform=`translateX(${dx}px) rotate(${dx/16}deg)`;sy.style.opacity=Math.max(0,Math.min(1,dx/90));sn.style.opacity=Math.max(0,Math.min(1,-dx/90))});
 const end=()=>{if(!on)return;on=false;if(dx>90)answer(1);else if(dx<-90)answer(0);else{c.classList.add("anim");c.style.transform="";sy.style.opacity=0;sn.style.opacity=0}};
 c.addEventListener("pointerup",end);c.addEventListener("pointercancel",end)}

/* ---------- RADAR */
const CATL={"Premiers instants":"1re impression","La conversation":"Conversation","La vibe":"Vibe","Le non négociable":"Respect","Le moment gênant":"Addition","Le fond":"Profondeur","L'après":"Suivi","Le verdict du cœur":"Feeling","Tes questions":"Tes critères","La suite":"La suite","Pour aller plus loin":"Approfondi"};
function radar(ans){const cats=[...new Set(Q.map(q=>q.cat))];
 const pts=cats.map(c=>{const v=Q.filter(q=>q.cat===c&&ans[q.id]!==undefined).map(q=>val(ans[q.id]));return{c,v:v.length?v.reduce((a,b)=>a+b,0)/v.length:null}}).filter(p=>p.v!==null);
 if(pts.length<3)return "";const N=pts.length,R=76,cx=170,cy=112;const P=(i,r)=>{const a=-Math.PI/2+i*2*Math.PI/N;return[cx+Math.cos(a)*r,cy+Math.sin(a)*r]};
 const grid=[.25,.5,.75,1].map(k=>`<polygon points="${pts.map((_,i)=>P(i,R*k).map(n=>n.toFixed(1)).join(",")).join(" ")}" fill="none" stroke="var(--line)" stroke-width="1"/>`).join("");
 const axes=pts.map((_,i)=>{const[x,y]=P(i,R);return `<line x1="${cx}" y1="${cy}" x2="${x.toFixed(1)}" y2="${y.toFixed(1)}" stroke="var(--line)"/>`}).join("");
 const poly=pts.map((p,i)=>P(i,R*Math.max(.05,p.v)).map(n=>n.toFixed(1)).join(",")).join(" ");
 const dots=pts.map((p,i)=>{const[x,y]=P(i,R*Math.max(.05,p.v));return `<circle cx="${x.toFixed(1)}" cy="${y.toFixed(1)}" r="4" fill="${p.v>=.7?"var(--keep)":p.v>=.5?"var(--maybe)":"var(--next)"}"/>`}).join("");
 const lab=pts.map((p,i)=>{const[x,y]=P(i,R+16);const anc=Math.abs(x-cx)<10?"middle":x>cx?"start":"end";return `<text x="${x.toFixed(1)}" y="${(y+4).toFixed(1)}" text-anchor="${anc}" font-size="11" font-weight="700" fill="var(--muted)">${esc(CATL[p.c]||p.c)}</text>`}).join("");
 return `<div class="fbox glass"><h3><span>Le détail du score</span></h3><svg viewBox="0 0 340 226" style="width:100%;display:block" role="img" aria-label="Score par catégorie">${grid}${axes}<polygon points="${poly}" fill="var(--accent)" fill-opacity=".22" stroke="var(--accent)" stroke-width="2.5" stroke-linejoin="round"/>${dots}${lab}</svg></div>`}

 e.style.setProperty("--dx",(Math.random()*opts.dx*2-opts.dx)+"px");e.style.setProperty("--rot",(Math.random()*opts.rot*2-opts.rot)+"deg");

 c.addEventListener("pointermove",e=>{if(!on)return;dx=e.clientX-x0;c.style.transform=`translateX(${dx}px) rotate(${dx/16}deg)`;sy.style.opacity=Math.max(0,Math.min(1,dx/90));sn.style.opacity=Math.max(0,Math.min(1,-dx/90))});
 const end=()=>{if(!on)return;on=false;if(dx>90)answer(1);else if(dx<-90)answer(0);else{c.classList.add("anim");c.style.transform="";sy.style.opacity=0;sn.style.opacity=0}};

/* ---------- LOCK */
let hiddenAt=0;
const hsh=s=>{let h=5381;for(const c of String(s))h=((h<<5)+h+c.charCodeAt(0))|0;return "h"+h};
function showLock(mode,first){let code="";const L=document.createElement("div");L.id="lock";L.className="lockscr";
 const draw=()=>{L.innerHTML=`<div class="lk-in"><div class="brand">Keep <em>or</em> Next</div><p class="lk-t">${mode==="unlock"?"Enter your passcode":mode==="set1"?"Choose a 4-digit passcode":"Confirm your passcode"}</p>
  <div class="pins">${[0,1,2,3].map(i=>`<i class="${i<code.length?"on":""}"></i>`).join("")}</div>
  <div class="pad">${[1,2,3,4,5,6,7,8,9,"",0,"⌫"].map(k=>k===""?"<span></span>":`<button data-k="${k}" aria-label="${k==="⌫"?"Delete":k}">${k}</button>`).join("")}</div>
  ${mode!=="unlock"?'<button class="lk-l" data-k="cancel">Cancel</button>':'<button class="lk-l" data-k="forgot">Forgot passcode?</button>'}</div>`;
  L.querySelectorAll("[data-k]").forEach(b=>b.onclick=()=>{const k=b.dataset.k;
   if(k==="cancel"){L.remove();return}
   if(k==="forgot"){arm(b,"⚠️ Tap again: EVERYTHING will be erased, no way back","Forgot passcode?",()=>{const cb=S.cb;S=fresh();S.cb=cb;save();rebuildQ();L.remove();startOnb()});return}
   if(k==="⌫"){code=code.slice(0,-1);draw();return}if(code.length<4){code+=k;draw()}if(code.length===4)setTimeout(done,140)})};
 const done=()=>{if(mode==="unlock"){if(hsh(code)===S.pin)L.remove();else{L.querySelector(".pins").classList.add("err");code="";setTimeout(draw,450)}}
  else if(mode==="set1"){L.remove();showLock("set2",code)}
  else if(code===first){S.pin=hsh(code);save();L.remove();toast("Passcode on 🔒");render()}else{toast("The passcodes don't match");L.remove();showLock("set1")}};
 document.querySelectorAll("#lock").forEach(e=>e.remove());draw();document.body.appendChild(L)}
document.addEventListener("visibilitychange",()=>{if(document.hidden)hiddenAt=Date.now();else if(S.pin&&hiddenAt&&Date.now()-hiddenAt>60000&&!document.getElementById("lock"))showLock("unlock")});

 if(view==="intro"){const tr=$("#itrack"),ds=[...document.querySelectorAll("#idots i")],nb=$("#inext"),N=ds.length;const cur=()=>Math.round(tr.scrollLeft/Math.max(1,tr.clientWidth));const upd=()=>{const k=cur();ds.forEach((d,j)=>d.classList.toggle("on",j===k));nb.textContent=k>=N-1?"Create my profile":"Continue"};tr.addEventListener("scroll",upd,{passive:true});m.querySelectorAll("[data-intro]").forEach(b=>b.onclick=()=>{if(b.dataset.intro==="skip")return introDone();const k=cur();if(k>=N-1)introDone();else tr.scrollTo({left:(k+1)*tr.clientWidth,behavior:"smooth"})});ds.forEach((d,j)=>d.onclick=()=>tr.scrollTo({left:j*tr.clientWidth,behavior:"smooth"}))}
 if(view==="settings"){const sl=S.prefs.likes=S.prefs.likes||[],bx=$("#s-lkbox");if(bx){bx.querySelectorAll("[data-sl]").forEach(b=>b.onclick=()=>{const v=b.dataset.sl,i=sl.indexOf(v);if(i>-1)sl.splice(i,1);else sl.push(v);b.setAttribute("aria-pressed",i<0);save()});bindAddLike(m,"#s-lkadd","#s-lkbtn",bx,sl,"data-sl",save)}}
 if(view==="onb"){const ob=$("#o-lkbox");if(ob){ob.querySelectorAll("[data-ol]").forEach(b=>b.onclick=()=>{const v=b.dataset.ol,i=onb.likes.indexOf(v);if(i>-1)onb.likes.splice(i,1);else onb.likes.push(v);b.setAttribute("aria-pressed",i<0)});bindAddLike(m,"#o-lkadd","#o-lkbtn",ob,onb.likes,"data-ol")}
  m.querySelectorAll("[data-onb]").forEach(b=>b.onclick=()=>{const a=b.dataset.onb;if(a==="next")onbNext();else if(a==="done")onbDone();else{S.onboarded=true;save();onb=null;setView("home")}});
  m.querySelectorAll("[data-tp]").forEach(b=>b.onclick=()=>{const k=b.dataset.tp,v=b.dataset.pv;const a=onb.type[k]=onb.type[k]||[];const j=a.indexOf(v);if(j>=0)a.splice(j,1);else a.push(v);b.setAttribute("aria-pressed",j<0)});
  m.querySelectorAll("[data-pick]").forEach(b=>b.onclick=()=>{const k=b.dataset.pick,id=b.dataset.id;
   if(Array.isArray(onb[k])){const i=onb[k].indexOf(id);if(i>=0)onb[k].splice(i,1);else if(onb[k].length<6)onb[k].push(id);else{toast("6 max, make a choice 😉");return}}
   else onb[k]=onb[k]===id?"":id;readAges();const me=$("#o-me");if(me)onb.me=me.value.trim();const y=window.scrollY;render();window.scrollTo({top:y})})}
 if(view==="eval"){
  const nm=$("#f-name");if(nm)nm.oninput=()=>{ev.name=nm.value.trim();nm.style.borderColor=""};
  const dt=$("#f-date");if(dt)dt.onchange=()=>{if(dt.value>today()){dt.value=today();toast("That day hasn't happened yet. Use “Upcoming date” instead 😉")}ev.date=dt.value||today()};
  const tmI=$("#f-time");if(tmI)tmI.onchange=tmI.oninput=()=>ev.time=tmI.value;
  const nt=$("#f-note");if(nt)nt.oninput=()=>ev.note=nt.value.trim();
  const de=$("#det");if(de)de.ontoggle=()=>{ev.detOpen=de.open};
  const nt2=$("#f-nat");if(nt2)nt2.onchange=()=>{ev.phys.nat=nt2.value};const ag=$("#f-age");if(ag)ag.oninput=()=>{ev.phys.age=ag.value.replace(/\D/g,"").slice(0,2)};
  m.querySelectorAll("[data-lk]").forEach(b=>b.onclick=()=>{const v=b.dataset.lk,i=ev.likes.indexOf(v);if(i>-1)ev.likes.splice(i,1);else ev.likes.push(v);b.setAttribute("aria-pressed",i<0)});
  bindAddLike(m,"#e-lkadd","#e-lkbtn",$("#e-lkbox"),ev.likes,"data-lk");
  m.querySelectorAll("[data-vb]").forEach(b=>b.onclick=()=>{ev.vibe=ev.vibe===b.dataset.vb?"":b.dataset.vb;m.querySelectorAll("[data-vb]").forEach(x=>x.setAttribute("aria-pressed",x.dataset.vb===ev.vibe));if(ev.vibe&&ev.pre&&vrank(ev.pre)&&vrank(ev.vibe))vibeFx(vrank(ev.vibe)-vrank(ev.pre),ev.dg);else{const el=$("#vibecmp");if(el){el.textContent="";el.className="vibecmp"}}});
  m.querySelectorAll("[data-ph]").forEach(b=>b.onclick=()=>{const k=b.dataset.ph;ev.phys[k]=ev.phys[k]===b.dataset.pv?"":b.dataset.pv;m.querySelectorAll(`[data-ph="${k}"]`).forEach(x=>x.setAttribute("aria-pressed",x.dataset.pv===ev.phys[k]))});
  m.querySelectorAll("[data-dg]").forEach(b=>b.onclick=()=>{ev.dg=b.dataset.dg;if(ev.dg==="f")delete ev.phys.beard;const y=window.scrollY;render();window.scrollTo({top:y})});
  const ph=$("#f-photo");if(ph)ph.onchange=()=>readPhoto(ph.files[0],u=>{ev.photo=u;render()});
  m.querySelectorAll("[data-src]").forEach(b=>b.onclick=()=>{ev.source=ev.source===b.dataset.src?"":b.dataset.src;m.querySelectorAll("[data-src]").forEach(x=>x.setAttribute("aria-pressed",x.dataset.src===ev.source))});
  m.querySelectorAll("[data-a]").forEach(b=>b.onclick=()=>answer(b.dataset.a==="1"?1:0));
  m.querySelectorAll(".nu").forEach(b=>b.onclick=()=>answer(parseFloat(b.dataset.val)));
  m.querySelectorAll("[data-decide]").forEach(b=>b.onclick=()=>decide(b.dataset.decide));
  const c=$("#qcard");if(c)swipe(c);if(ev.step==="result")animResult()}}
let armed=null;
function arm(b,msg,orig,fn){if(armed!==b){armed=b;b.textContent=msg;setTimeout(()=>{if(armed===b){armed=null;if(document.body.contains(b))b.textContent=orig}},3500)}else{armed=null;fn()}}
function act(a,b){
 if(a==="new")openNewChoice();else if(a==="newpast"){closeSheet();newEval()}else if(a==="newplan")openPlan(true)
 else if(a==="lang-fr"||a==="lang-en"){try{localStorage.setItem("kon-lang",a.slice(5))}catch(e){}location.reload()}
 else if(a==="onb"){closeSheet();startOnb()}else if(a==="intro"){closeSheet();startIntro()}
 else if(a==="clearex"){S.guys=S.guys.filter(g=>!g.example);S.plans=(S.plans||[]).filter(p=>!p.example);save();toast("Examples deleted");render()}
 else if(a==="addex"){S.guys=S.guys.filter(g=>!g.example).concat(examples());S.plans=(S.plans||[]).filter(p=>!p.example).concat(demoPlans());save();toast("Examples are back");render()}
 else if(a==="reset")arm(b,"Tap again: everything will be reset","Start over like day one",()=>{const cb=S.cb;S=fresh();S.cb=cb;save();rebuildQ();startIntro()});
 else if(a==="wipe")arm(b,"Tap again to confirm","Delete everything",()=>{S.guys=[];save();toast("All cleared");render()});
 else if(a==="quit"){ev=null;setView("home")}
 else if(a==="start"){if(!ev.name){const i=$("#f-name");i.focus();i.style.borderColor="var(--next)";i.placeholder="At least a first name, please 😉";return}if(ev.date>today())ev.date=today();ev.step="q";ev.i=0;render()}
 else if(a==="deepen"){const used=new Set(ev.list.map(q=>q.id));ev.deepFrom=ev.list.length;ev.list=ev.list.concat(shuffle(DEEP.filter(q=>!used.has(q.id))).slice(0,6));ev.deep=true;ev.step="q";ev.i=ev.deepFrom;ev.nuance=false;render();window.scrollTo({top:0})}
 else if(a==="prev"){if(ev.nuance){ev.nuance=false}else if(ev.step==="result"){ev.step="q";ev.i=ev.list.length-1}else if(ev.i>0)ev.i--;else ev.step="info";render()}
 else if(a==="nuance"){ev.nuance=true;render()}
 else if(a==="skip")answer(null);
 else if(a==="close")closeSheet();
 else if(a==="plan")openPlan();
 else if(a==="safe")openSafety({});
 else if(a==="guide")setView("tips");
 else if(a==="a2hsx"){S.a2hs=1;save();render()}
 else if(a==="sharecur")openShare({name:ev.name,photo:ev.photo,ill:ev.photo?undefined:ev.ill,answers:ev.answers,phys:ev.phys,dg:ev.dg});
 else if(a==="lock"){if(S.pin){delete S.pin;save();toast("Passcode off");render()}else showLock("set1")}
 else if(a==="discreet"){S.discreet=!S.discreet;save();document.documentElement.classList.toggle("discreet",S.discreet);render()}
 else if(a==="bkcopy")copyBackup();
 else if(a==="bkshow"){const w=$("#bk-in-w");w.hidden=!w.hidden;if(!w.hidden)$("#bk-in").focus()}
 else if(a==="bkrestore")restore(b);
 else if(a==="cqadd"){const q=$("#cq-q").value.trim(),sh=$("#cq-s").value.trim();if(!q){$("#cq-q").focus();return}S.customQ=S.customQ||[];
  S.customQ.push({id:"c"+Date.now(),q:/\?$/.test(q)?q:q+"?",short:sh||q.replace(/\s*\?$/,"").slice(0,28)});save();rebuildQ();toast("Question added ✍️");render()}}
function bindSheet(g){const L=$("#layer");
 L.querySelectorAll("[data-act]").forEach(b=>b.onclick=()=>act(b.dataset.act,b));
 L.querySelectorAll("[data-move]").forEach(b=>b.onclick=()=>{g.status=b.dataset.move;save();burst(g.status);render();openSheet(g.id)});
 L.querySelectorAll("[data-edit]").forEach(b=>b.onclick=()=>openEditGuy(g));
 const ph=$("#s-photo");if(ph)ph.onchange=()=>readPhoto(ph.files[0],u=>{g.photo=u;delete g.ill;save();render();openSheet(g.id)});
 const an=$("#s-addnote");if(an)an.onclick=()=>{const t=$("#s-note").value.trim();if(!t){$("#s-note").focus();return}g.notes=g.notes||[];g.notes.unshift({t:new Date().toISOString(),x:t});save();toast("Note added 📝");render();openSheet(g.id)};
 L.querySelectorAll("[data-dn]").forEach(b=>b.onclick=()=>{g.notes.splice(+b.dataset.dn,1);save();render();openSheet(g.id)});
 const d=$("#del");if(d)d.onclick=()=>arm(d,"Tap again to delete","Delete this profile",()=>{S.guys=S.guys.filter(x=>x.id!==g.id);save();closeSheet();toast("Profile deleted");render()})}

document.querySelectorAll("[data-v]").forEach(b=>b.onclick=()=>{closeSheet();if(b.id==="hub"&&view==="dates"){openNewChoice();return}ev=null;setView(b.dataset.v)});
document.addEventListener("keydown",e=>{if(e.key==="Escape")closeSheet();if(view==="eval"&&ev&&ev.step==="q"&&!ev.nuance){if(e.key==="ArrowRight")answer(1);if(e.key==="ArrowLeft")answer(0)}});
document.documentElement.classList.toggle("cb",!!S.cb);document.documentElement.classList.toggle("discreet",!!S.discreet);rebuildQ();
if(!S.onboarded){if(S.intro)startOnb();else startIntro()}else setView("home");
if(S.pin)showLock("unlock");
};
</script>

(function(){var L;try{L=localStorage.getItem("kon-lang")}catch(e){}if(L!=="fr"&&L!=="en")L=/^fr/i.test(navigator.language||"")?"fr":"en";(L==="en"?window.KON_EN:window.KON_FR)()})();
</script>
